
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ليل | حساباتي</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow-x: hidden;
    background: radial-gradient(ellipse at top, #172033 0%, #070910 45%, #000 100%);
    color: white;
    font-family: Tahoma, Arial, sans-serif;
}

/* النجوم */
#stars {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
}

/* محتوى الموقع */
.container {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 35px 20px;
}

/* القمر */
.moon {
    width: 125px;
    height: 125px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 32% 28%,
      #fff 0%, #f0f0eb 30%, #c5c9d4 62%, #777f92 100%);
    box-shadow:
      0 0 25px #dce5ff88,
      0 0 65px #a8bbff55,
      0 0 120px #a8bbff22;
    margin-bottom: 35px;
    animation: moonGlow 4s ease-in-out infinite alternate;
}

@keyframes moonGlow {
    from {
        box-shadow: 0 0 25px #dce5ff66, 0 0 60px #a8bbff33;
    }
    to {
        box-shadow: 0 0 40px #dce5ffbb, 0 0 100px #a8bbff66;
    }
}

h1 {
    font-size: 36px;
    letter-spacing: 3px;
    margin-bottom: 12px;
    text-shadow: 0 0 20px #ffffff55;
}

.subtitle {
    color: #a8afc4;
    font-size: 14px;
    margin-bottom: 35px;
}

/* روابط الحسابات */
.socials {
    width: 100%;
    max-width: 340px;
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.social-link {
    text-decoration: none;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 17px;
    border: 1px solid #ffffff25;
    border-radius: 16px;
    background: #ffffff09;
    backdrop-filter: blur(10px);
    font-size: 16px;
    transition: 0.3s ease;
}

.social-link:hover {
    transform: translateY(-4px);
    background: #ffffff18;
    border-color: #ffffff80;
    box-shadow: 0 0 25px #ffffff12;
}

.icon {
    font-size: 23px;
}

.note {
    color: #858ba0;
    font-size: 12px;
    margin-top: 35px;
}

footer {
    margin-top: 18px;
    color: #565d70;
    font-size: 11px;
}

/* الجوال */
@media (max-width: 480px) {
    h1 { font-size: 30px; }
    .moon {
        width: 105px;
        height: 105px;
    }
}
</style>
</head>

<body>

<canvas id="stars"></canvas>

<main class="container">

    <div class="moon"></div>

    <!-- غيّر الاسم هنا -->
    <h1> FM </h1>
    <p class="subtitle">✦    ✦</p>

    <div class="socials">

        <!-- حط رابط تيك توك مكان الرابط -->
        <a class="social-link"
           href="https://www.tiktok.com/@md.404x?_r=1&_t=ZS-9ARLEnL107k"
           target="_blank" rel="noopener noreferrer">
            <span class="icon">♪</span>
            <span>حسابي في تيك توك</span>
        </a>

        <!-- حط رابط سناب شات مكان الرابط -->
        <a class="social-link"
           href="https://www.snapchat.com/add/md.404q?share_id=0puH0VnBTW-YXAJ8exBEqQ&locale=ar_KW"
           target="_blank" rel="noopener noreferrer">
            <span class="icon">👻</span>
            <span>حسابي في سناب شات</span>
        </a>

        <!-- حط رابط حسابك الثالث هنا -->
       
    </div>

    <p class="note">انظر إلى القمر، يمكن نكون نطالع فيه سوا 🌙</p>

    <footer>صُنع بكل هدوء تحت ضوء القمر</footer>

</main>

<script>
// إنشاء النجوم المتحركة
const canvas = document.getElementById("stars");
const ctx = canvas.getContext("2d");

let stars = [];

function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    stars = Array.from({ length: 160 }, () => ({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        r: Math.random() * 1.5 + 0.3,
        alpha: Math.random(),
        speed: Math.random() * 0.012 + 0.003
    }));
}

function animate() {
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

    stars.forEach(star => {
        star.alpha += star.speed;

        const opacity = (Math.sin(star.alpha) + 1) / 2;

        ctx.beginPath();
        ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${opacity})`;
        ctx.shadowBlur = 8;
        ctx.shadowColor = "#ffffff";

        ctx.fill();
    });

    ctx.shadowBlur = 0;
    requestAnimationFrame(animate);
}

window.addEventListener("resize", resize);

resize();
animate();
</script>

</body>
</html>
